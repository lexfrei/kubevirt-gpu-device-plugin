name: Release Third-Party Notices

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the committed notice
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG}}"
          if [ -z "${TAG}" ]; then
            echo "::error::could not determine the GitHub Release tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^VERSION ?= //p' versions.mk)
          test "${VERSION}" = "${RELEASE_TAG}" || {
            echo "::error::release tag and versions.mk disagree"
            exit 1
          }
          echo "GOLANG_VERSION=$(sed -n 's/^GOLANG_VERSION ?= //p' versions.mk)" >> "$GITHUB_ENV"

      - name: Install Go for notice verification
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GOLANG_VERSION }}

      - name: Verify notice matches tagged dependencies
        run: make notices-check

      - name: Verify the committed notice
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -s THIRD_PARTY_NOTICES.md ]; then
            echo "::error::THIRD_PARTY_NOTICES.md is missing or empty at ${RELEASE_TAG}"
            exit 1
          fi
          git ls-files --error-unmatch THIRD_PARTY_NOTICES.md >/dev/null
          sha256sum THIRD_PARTY_NOTICES.md

      # Do not overwrite an existing asset: it may be an approved historical
      # correction that intentionally differs from the original tagged notice.
      - name: Attach the committed notice without replacing an existing asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" THIRD_PARTY_NOTICES.md
